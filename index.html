<title>Ôn tập Tiếng Anh 4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap">
<style>
/* Layout: sticky top bar with 3 tabs; unit chips; content cards; test runner with sticky submit bar */
:root{
  --bg:#eef4fb; --card:#ffffff; --ink:#13233f; --mut:#5a6a86; --line:#d3deee;
  --brand:#1f5eff; --brand-ink:#ffffff; --sun:#ffb703; --sun-ink:#3a2a00;
  --good:#0f9d58; --good-bg:#e2f6ea; --bad:#d93a40; --bad-bg:#fde8e9; --soft:#e4edff;
  --t0:#2f6bff; --t1:#10a368; --t2:#f07b1d; --t3:#8b5cf6;
  --f-d:'Baloo 2','Nunito',system-ui,sans-serif; --f-b:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1525; --card:#142238; --ink:#e8eefb; --mut:#9db0d0; --line:#26395a;
  --brand:#6f95ff; --brand-ink:#0b1630; --sun:#ffc43d; --sun-ink:#2b1f00;
  --good:#3fd187; --good-bg:#12362a; --bad:#ff7076; --bad-bg:#3a1c22; --soft:#1c2f52; --t0:#6f95ff; --t1:#3fd187; --t2:#ffa04d; --t3:#b08cff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1525; --card:#142238; --ink:#e8eefb; --mut:#9db0d0; --line:#26395a;
  --brand:#6f95ff; --brand-ink:#0b1630; --sun:#ffc43d; --sun-ink:#2b1f00;
  --good:#3fd187; --good-bg:#12362a; --bad:#ff7076; --bad-bg:#3a1c22; --soft:#1c2f52; --t0:#6f95ff; --t1:#3fd187; --t2:#ffa04d; --t3:#b08cff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-b);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
.wrap{max-width:960px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
header.top .in{max-width:960px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
h1{font:800 22px/1.1 var(--f-d);margin:0;letter-spacing:.2px}
h1 small{display:block;font:700 11px var(--f-b);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
nav.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
nav.tabs button{border:0;background:none;color:var(--ink);font:700 15px var(--f-b);padding:8px 14px;border-radius:9px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
main{padding-top:18px}
h2{font:800 24px/1.2 var(--f-d);margin:0 0 4px;text-wrap:balance}
h3{font:700 18px/1.3 var(--f-d);margin:0}
.sub{color:var(--mut);margin:0 0 14px}
.theme{margin:14px 0 6px;font:800 12px var(--f-b);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 11px;font:700 14px var(--f-b);cursor:pointer;min-width:44px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}
.btn{border:0;border-radius:11px;padding:10px 16px;font:800 15px var(--f-b);cursor:pointer;background:var(--brand);color:var(--brand-ink)}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.vc{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;color:inherit;min-width:0}
.vc:hover{border-color:var(--brand)}
.vc .en{font:800 17px/1.2 var(--f-d);overflow-wrap:anywhere}
.vc .vi{color:var(--mut);font-size:14px;min-height:21px}
.hide-vi .vc .vi{visibility:hidden}
.pic{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:56px;font-size:44px;line-height:1}
.pic.tx{font:800 22px var(--f-d);background:var(--soft);border-radius:10px;padding:10px 12px;font-size:20px;min-height:48px}
.pic .flag{width:72px;height:48px;border-radius:6px;border:1px solid var(--line);display:block}
.sm .pic{min-width:48px;min-height:44px;font-size:32px}
.sm .pic .flag{width:60px;height:40px}
.sm .pic.tx{font-size:16px;min-height:40px}
.pat{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.pat:first-child{border-top:0}
.pat .q{font:800 17px var(--f-d)}
.pat .a{font-weight:700;color:var(--brand)}
.pat .v{color:var(--mut);font-size:14px}
.sp{border:0;background:var(--soft);color:var(--ink);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:17px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.sp svg{width:18px;height:18px;fill:currentColor}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pg{margin:0;cursor:zoom-in;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0}
.pg img{width:100%;height:auto;display:block;border-radius:6px;background:#fff}
.pg figcaption{font-size:13px;color:var(--mut);padding-top:4px;text-align:center}
.pg.big{grid-column:1/-1;cursor:zoom-out}
.pg.big img{max-width:760px;margin:0 auto}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{display:flex;flex-direction:column;gap:6px}
.tcard .meta{color:var(--mut);font-size:14px;flex:1}
.best{font:800 13px var(--f-b);color:var(--good)}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:6px 9px;max-width:100%}
input[type=text]{min-width:120px;width:200px}
select{min-width:70px}
/* test */
.runbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:15;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.timer{font:800 20px var(--f-d);font-variant-numeric:tabular-nums}
.sec{margin:22px 0 8px;padding:8px 12px;border-radius:10px;font:800 17px var(--f-d);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec.L{background:#dbe7ff;color:#0f2d78}.sec.R{background:#d9f3e2;color:#0b4a27}.sec.W{background:#ffeab8;color:#5a3d00}.sec.S{background:#fbdbe9;color:#6b1240}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sec{filter:brightness(.82) saturate(.9)}}
:root[data-theme="dark"] .sec{filter:brightness(.82) saturate(.9)}
.part{margin:14px 0}
.part h4{margin:0 0 2px;font:800 16px var(--f-d);color:var(--brand)}
.part .hint{color:var(--mut);font-size:14px;margin:0 0 8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:8px}
.row.ok{border-color:var(--good);background:var(--good-bg)}
.row.bad{border-color:var(--bad);background:var(--bad-bg)}
.row .n{font:800 16px var(--f-d);color:var(--brand);min-width:20px}
.row .txt{flex:1 1 220px;min-width:0}
.opts{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.opt{display:flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;background:var(--card)}
.opt input{accent-color:var(--brand);width:18px;height:18px;margin:0}
.opt:has(input:checked){border-color:var(--brand);background:var(--soft)}
.opt.picopt{flex-direction:column;padding:8px 12px;gap:4px}
.opt .L{font:800 14px var(--f-d)}
.ans{flex-basis:100%;font-size:14px;font-weight:800;color:var(--good)}
.row.bad .ans{color:var(--bad)}
.cardsrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cardsrow .opt{pointer-events:none;flex-direction:column;align-items:center}
.pass{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;line-height:2.1}
.pass select{margin:0 4px}
.wb{background:var(--soft);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-weight:700}
.tok{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:5px 10px;font:700 15px var(--f-b);cursor:pointer}
.tok.used{opacity:.3}
.built{min-height:42px;flex:1 1 260px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:2px dashed var(--line);padding:4px 2px}
.built .tok{background:var(--soft)}
.miss{font:800 20px var(--f-d);letter-spacing:.1em}
.result{background:var(--card);border:2px solid var(--brand);border-radius:16px;padding:18px;margin-bottom:14px}
.score{font:800 52px/1 var(--f-d);color:var(--brand)}
.score small{font-size:22px;color:var(--mut)}
.bd{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.bd div{background:var(--soft);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.warn{background:var(--sun);color:var(--sun-ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;margin-bottom:12px}
.note{font-size:13px;color:var(--mut)}
@media (max-width:520px){h1{font-size:19px}nav.tabs button{padding:7px 8px;font-size:13px}.grid{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- visual polish ---- */
body{background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1.2px,transparent 1.3px);background-size:22px 22px}
[data-th="0"]{--tc:var(--t0)}[data-th="1"]{--tc:var(--t1)}[data-th="2"]{--tc:var(--t2)}[data-th="3"]{--tc:var(--t3)}
header.top{box-shadow:0 2px 12px color-mix(in srgb,var(--ink) 8%,transparent)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:800 20px var(--f-d);transform:rotate(-6deg);box-shadow:3px 3px 0 var(--sun)}
nav.tabs{padding:5px;gap:5px;max-width:100%;overflow-x:auto}
nav.tabs button{transition:background .15s,transform .15s}
nav.tabs button:hover{transform:translateY(-1px)}
nav.tabs button[aria-selected="true"]{box-shadow:0 3px 0 color-mix(in srgb,var(--brand) 60%,#000)}
h2{font-size:28px}
.theme{display:flex;align-items:center;gap:8px;margin:16px 0 8px;color:var(--ink)}
.theme::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--tc,var(--mut))}
.chips{gap:8px}
.chip{--tc:var(--brand);border-width:2px;border-radius:12px;padding:8px 13px;font-size:15px;transition:transform .12s,border-color .12s}
.chip:hover{transform:translateY(-2px);border-color:var(--tc)}
.chip[aria-pressed="true"]{background:var(--tc);border-color:var(--tc);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--tc) 60%,#000)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0b1630}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0b1630}}
.uhead{display:flex;gap:14px;align-items:center;flex:1 1 260px;min-width:0}
.ubadge{flex:none;width:58px;height:58px;border-radius:16px;background:var(--tc);color:#fff;display:grid;place-items:center;font:800 30px var(--f-d);box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 60%,#000)}
:root[data-theme="dark"] .ubadge{color:#0b1630}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ubadge{color:#0b1630}}
.vc{border-width:2px;border-top:6px solid var(--tc,var(--line));padding:14px 10px 12px;gap:6px;transition:transform .15s,box-shadow .15s}
.vc:hover{transform:translateY(-3px);box-shadow:0 8px 18px color-mix(in srgb,var(--tc) 22%,transparent);border-color:var(--tc)}
.vc:active{transform:scale(.97)}
.vc .pic{background:color-mix(in srgb,var(--tc) 11%,var(--card));border-radius:14px;min-width:84px;min-height:72px;padding:6px 10px;font-size:50px}
.vc .pic.tx{font-size:20px}
.vc .en{font-size:18px}
.card{border-radius:18px;box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 7%,transparent)}
.pat .q{color:var(--ink)}
.pat .a{background:color-mix(in srgb,var(--brand) 10%,var(--card));display:inline-block;padding:2px 10px;border-radius:8px;margin:3px 0}
.tests{gap:16px}
.tcard{border-top:7px solid var(--tc);position:relative;padding-top:14px}
.tcard .big{font-size:36px;line-height:1}
.tcard .tag{align-self:flex-start;background:color-mix(in srgb,var(--tc) 15%,var(--card));color:var(--ink);border-radius:8px;padding:2px 10px;font:800 12px var(--f-b);letter-spacing:.06em;text-transform:uppercase}
.tcard .btn{background:var(--tc);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--tc) 60%,#000)}
:root[data-theme="dark"] .tcard .btn{color:#0b1630}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tcard .btn{color:#0b1630}}
.btn{box-shadow:0 3px 0 color-mix(in srgb,var(--brand) 55%,#000);transition:transform .1s,box-shadow .1s}
.btn.alt{box-shadow:0 3px 0 var(--line)}
.btn.sun{box-shadow:0 3px 0 color-mix(in srgb,var(--sun) 55%,#000)}
.btn:active{transform:translateY(2px);box-shadow:none}
.row{border-radius:14px;border-width:2px}
.sec{border-radius:14px;font-size:19px;padding:10px 14px}
.part h4{font-size:17px}
.result{border-radius:22px;border-width:3px;text-align:center}
.result .bd{justify-content:center}
.score{font-size:68px}
.runbar{border-radius:14px;box-shadow:0 4px 14px color-mix(in srgb,var(--ink) 10%,transparent)}
.hero{display:flex;gap:16px;align-items:center;background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:16px 20px;margin-bottom:6px;box-shadow:0 5px 0 color-mix(in srgb,var(--brand) 55%,#000)}
.hero .big{font-size:44px;line-height:1}
.hero h2{margin:0;color:inherit}.hero .sub{margin:0;color:inherit;opacity:.88}
@media (max-width:520px){.ubadge{width:48px;height:48px;font-size:24px}h2{font-size:24px}.hero .big{font-size:34px}}

.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.mc{background:var(--brand);color:var(--brand-ink);border:0;border-radius:14px;min-height:104px;font:800 32px var(--f-d);cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--brand) 55%,#000);display:grid;place-items:center;padding:6px;min-width:0}
.mc:not(.up)::after{content:"?"}
.mc.up{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none;cursor:default}
.mc.ok{background:var(--good-bg);border-color:var(--good)}
.mc .wd{font:800 17px/1.2 var(--f-d);overflow-wrap:anywhere}
.mc .pic{min-width:0;font-size:38px}.mc .pic .flag{width:58px;height:38px}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.ghead .pill{background:var(--soft);border-radius:999px;padding:4px 14px;font:800 16px var(--f-d)}
.big-say{display:flex;justify-content:center;margin:14px 0}
.big-say .sp{width:84px;height:84px}.big-say .sp svg{width:38px;height:38px}
.opts4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opts4 .vc.good{background:var(--good-bg);border-color:var(--good)}.opts4 .vc.bad{background:var(--bad-bg);border-color:var(--bad)}
.stage-c{text-align:center}
.letters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.letters .tok{font:800 24px var(--f-d);min-width:46px;padding:8px 10px;text-transform:lowercase}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:54px;margin:8px 0}
.slots .tok{font:800 24px var(--f-d);min-width:46px;padding:8px 10px;background:var(--soft)}
.slots.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.tfcard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px}
.tfcard .w{font:800 30px var(--f-d)}
.tfbtn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tfbtn .btn{font-size:20px;padding:14px}
.btn.yes{background:var(--good);color:#fff}.btn.no{background:var(--bad);color:#fff}
@media (max-width:520px){.mem{grid-template-columns:repeat(3,1fr)}}

/* ---- luxury theme ---- */
:root{--bg:#f3f5fb;--card:#fff;--ink:#111a3a;--mut:#5d6a8a;--line:#dde3f1;--brand:#1d3277;--brand-ink:#fff;--sun:#d4a63c;--sun-ink:#2a1d00;--good:#0f8f5f;--good-bg:#e0f4ea;--bad:#cf3a40;--bad-bg:#fbe7e8;--soft:#e8ecf8;--t0:#2f5fd0;--t1:#0e8a63;--t2:#cc7428;--t3:#7452cf;--hero:#14224f;--gold:#d4a63c;--f-b:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;--f-d:'Be Vietnam Pro',system-ui,sans-serif;--f-s:'Playfair Display',Georgia,'Times New Roman',serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1127;--card:#121b38;--ink:#e9eefc;--mut:#9fb0d4;--line:#25335c;--brand:#8da6ff;--brand-ink:#0a1330;--sun:#e3b955;--sun-ink:#2a1d00;--good:#3fd187;--good-bg:#12362a;--bad:#ff7076;--bad-bg:#3a1c22;--soft:#1a2750;--t0:#7ea0ff;--t1:#3fd187;--t2:#ffa04d;--t3:#b79bff;--hero:#16255a;--gold:#e3b955;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1127;--card:#121b38;--ink:#e9eefc;--mut:#9fb0d4;--line:#25335c;--brand:#8da6ff;--brand-ink:#0a1330;--sun:#e3b955;--sun-ink:#2a1d00;--good:#3fd187;--good-bg:#12362a;--bad:#ff7076;--bad-bg:#3a1c22;--soft:#1a2750;--t0:#7ea0ff;--t1:#3fd187;--t2:#ffa04d;--t3:#b79bff;--hero:#16255a;--gold:#e3b955;color-scheme:dark}
body{background-image:radial-gradient(color-mix(in srgb,var(--ink) 7%,transparent) 1px,transparent 1.2px);background-size:26px 26px}
body::before{background:var(--hero)}
h1,h2,h3{font-family:var(--f-s);font-variant-numeric:lining-nums;letter-spacing:.2px}
h1{font-size:21px;color:#fff}h1 small{color:var(--gold);font-family:var(--f-b)}
header.top{background:var(--hero);border-bottom:2px solid var(--gold);box-shadow:0 6px 20px rgba(10,17,39,.25)}
.mark{background:var(--gold);color:#1a1200;font-family:var(--f-s);box-shadow:3px 3px 0 rgba(255,255,255,.25)}
nav.tabs{background:rgba(255,255,255,.1)}
nav.tabs button{color:#e9eefc;font-size:14px}
nav.tabs button[aria-selected="true"]{background:var(--gold);color:#1a1200;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.hero{background:var(--hero);color:#fff;border-radius:20px;box-shadow:0 8px 24px rgba(20,34,79,.25);border-bottom:3px solid var(--gold);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;border:2px solid color-mix(in srgb,var(--gold) 55%,transparent);box-shadow:0 0 0 18px color-mix(in srgb,var(--gold) 10%,transparent)}
