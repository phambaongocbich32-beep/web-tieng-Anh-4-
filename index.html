<style>
/* Layout: sticky top bar with 3 tabs; unit chips; content cards; test runner with sticky submit bar */
:root{
  --bg:#eef4fb; --card:#ffffff; --ink:#13233f; --mut:#5a6a86; --line:#d3deee;
  --brand:#1f5eff; --brand-ink:#ffffff; --sun:#ffb703; --sun-ink:#3a2a00;
  --good:#0f9d58; --good-bg:#e2f6ea; --bad:#d93a40; --bad-bg:#fde8e9; --soft:#e4edff;
  --t0:#2f6bff; --t1:#10a368; --t2:#f07b1d; --t3:#8b5cf6;
  --f-d:'Baloo 2','Nunito',system-ui,sans-serif; --f-b:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1525; --card:#142238; --ink:#e8eefb; --mut:#9db0d0; --line:#26395a;
  --brand:#6f95ff; --brand-ink:#0b1630; --sun:#ffc43d; --sun-ink:#2b1f00;
  --good:#3fd187; --good-bg:#12362a; --bad:#ff7076; --bad-bg:#3a1c22; --soft:#1c2f52; --t0:#6f95ff; --t1:#3fd187; --t2:#ffa04d; --t3:#b08cff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1525; --card:#142238; --ink:#e8eefb; --mut:#9db0d0; --line:#26395a;
  --brand:#6f95ff; --brand-ink:#0b1630; --sun:#ffc43d; --sun-ink:#2b1f00;
  --good:#3fd187; --good-bg:#12362a; --bad:#ff7076; --bad-bg:#3a1c22; --soft:#1c2f52; --t0:#6f95ff; --t1:#3fd187; --t2:#ffa04d; --t3:#b08cff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-b);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
.wrap{max-width:960px;margin:0 auto}

h1{font:800 22px/1.1 var(--f-d);margin:0;letter-spacing:.2px}
h1 small{display:block;font:700 11px var(--f-b);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
nav.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
nav.tabs button{border:0;background:none;color:var(--ink);font:700 15px var(--f-b);padding:8px 14px;border-radius:9px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
main{padding-top:18px}

.sub{color:var(--mut);margin:0 0 14px}
.theme{margin:14px 0 6px;font:800 12px var(--f-b);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.pic{display:inline-flex;align-items:center;justify-content:center;min-width:64px;min-height:56px;font-size:44px;line-height:1}

.sp svg{width:18px;height:18px;fill:currentColor}

.tcard .meta{color:var(--mut);font-size:14px;flex:1}

select{min-width:70px}

.runbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:15;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.timer{font:800 20px var(--f-d);font-variant-numeric:tabular-nums}

.sec.L{background:#dbe7ff;color:#0f2d78}.sec.R{background:#d9f3e2;color:#0b4a27}.sec.W{background:#ffeab8;color:#5a3d00}.sec.S{background:#fbdbe9;color:#6b1240}

:root[data-theme="dark"] .sec{filter:brightness(.82) saturate(.9)}
.part{margin:14px 0}
.part h4{margin:0 0 2px;font:800 16px var(--f-d);color:var(--brand)}
.part .hint{color:var(--mut);font-size:14px;margin:0 0 8px}

.opt .L{font:800 14px var(--f-d)}
.ans{flex-basis:100%;font-size:14px;font-weight:800;color:var(--good)}
.row.bad .ans{color:var(--bad)}
.cardsrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cardsrow .opt{pointer-events:none;flex-direction:column;align-items:center}
.pass{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;line-height:2.1}

.wb{background:var(--soft);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-weight:700}
.tok{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:5px 10px;font:700 15px var(--f-b);cursor:pointer}

.score{font:800 52px/1 var(--f-d);color:var(--brand)}

.bd{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.bd div{background:var(--soft);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.warn{background:var(--sun);color:var(--sun-ink);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;margin-bottom:12px}

@media (max-width:520px){h1{font-size:19px}nav.tabs button{padding:8px 10px;font-size:14px}.grid{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
"use strict";
/* ---------- helpers ---------- */
const h=(t,a,...c)=>{const e=document.createElement(t);if(a)for(const k in a){const v=a[k];if(k==='class')e.className=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v)}c.flat(9).forEach(x=>{if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(x))});return e};

};

let voice=null;

 ['R','PART 3: Read and complete','Chọn từ cho sẵn điền vào chỗ trống.',mkCloze,5],

const TESTS=[
 {id:'mid1',t:'Giữa học kì 1',d:'Unit 1 – 5',u:range(1,5),min:35},
 {id:'end1',t:'Cuối học kì 1',d:'Unit 1 – 10',u:range(1,10),min:35},
 {id:'mid2',t:'Giữa học kì 2',d:'Unit 11 – 15',u:range(11,15),min:35},
 {id:'end2',t:'Cuối học kì 2',d:'Unit 11 – 20',u:range(11,20),min:35},
 {id:'year',t:'Cả năm',d:'Unit 1 – 20',u:range(1,20),min:35}

const bestScores=store.get('e4best',{});
function saveBest(id,sc){if(!bestScores[id]||sc>bestScores[id]){bestScores[id]=sc;store.set('e4best',bestScores)}}

/* ---------- runner ---------- */
let timerH=null;
function runTest(def){ // def: {id,t,d,u,parts:[[sec,title,hint,fn,n]],min}
  clearInterval(timerH);const P=pool(def.u);const main=$main();main.replaceChildren();
  const built=def.parts.map(([sec,title,hint,fn,n])=>({sec,title,hint,part:fn(P,n)})).filter(b=>b.part.total>0);
  let left=(def.min||35)*60,submitted=false;
  const tm=h('span',{class:'timer'},fmt(left));
  const submit=h('button',{class:'btn sun',type:'button'},'Nộp bài');
  main.append(h('h2',null,def.t),h('p',{class:'sub'},def.d+' · Mỗi lần làm là một đề mới.'));
  if(!TTS)main.append(h('div',{class:'warn'},'Trình duyệt này không có giọng đọc. Phần Nghe cần loa hoặc tai nghe và trình duyệt hỗ trợ đọc tiếng Anh.'));
  main.append(h('div',{class:'runbar'},h('span',null,'Thời gian còn lại: ',tm),h('span',{style:'display:flex;gap:8px'},h('button',{class:'btn alt',type:'button',onclick:()=>{if(submitted||askExit())go()}},'Thoát'),submit)));
  const resBox=h('div');main.append(resBox);
  let curSec='';
  built.forEach(b=>{if(b.sec!==curSec){curSec=b.sec;main.append(h('div',{class:'sec '+SEC[curSec].c},h('span',null,SEC[curSec].n),h('span',null,SEC[curSec].pts+' điểm')))}
    main.append(h('div',{class:'part'},h('h4',null,b.title),h('p',{class:'hint'},b.hint),b.part.el))});
  timerH=setInterval(()=>{if(submitted)return clearInterval(timerH);left--;tm.textContent=fmt(Math.max(left,0));if(left===0){tm.style.color='var(--bad)'}},1000);
  let exitArmed=false;function askExit(){if(!exitArmed){exitArmed=true;const w=h('div',{class:'warn'},'Bấm “Thoát” lần nữa để rời khỏi bài. Bài đang làm sẽ bị bỏ.');main.insertBefore(w,resBox);setTimeout(()=>{exitArmed=false;w.remove()},4000);return false}return true}
  submit.addEventListener('click',()=>{if(submitted)return;submitted=true;clearInterval(timerH);submit.disabled=true;
    const per={};built.forEach(b=>{const r=b.part.grade();lockAll(b.part.el);const s=per[b.sec]||(per[b.sec]={ok:0,n:0});s.n+=r.length;s.ok+=r.filter(Boolean).length});
    let got=0,max=0;Object.keys(per).forEach(k=>{max+=SEC[k].pts;got+=SEC[k].pts*per[k].ok/per[k].n});
    const score=Math.round(got/max*10*100)/100;saveBest(def.id,score);
    const total=Object.values(per).reduce((a,s)=>a+s.ok,0),all=Object.values(per).reduce((a,s)=>a+s.n,0);
    const msg=score>=9?'Xuất sắc! Em nắm bài rất chắc.':score>=7?'Giỏi lắm! Xem lại các câu đỏ để đạt điểm cao hơn.':score>=5?'Khá rồi. Em ôn lại từ vựng và mẫu câu ở các câu sai nhé.':'Em cần ôn thêm. Hãy học lại từ vựng, mẫu câu rồi làm đề mới.';
    resBox.replaceChildren(h('div',{class:'result'},h('div',{class:'score'},String(score).replace('.',','),h('small',null,' / 10')),h('p',{style:'margin:6px 0 0;font-weight:700'},msg+' Đúng '+total+'/'+all+' câu.'),
      h('div',{class:'bd'},Object.keys(per).map(k=>h('div',null,SEC[k].tt+': '+per[k].ok+'/'+per[k].n+' câu'))),
      h('p',{class:'note'},'Câu đúng tô xanh, câu sai tô đỏ kèm đáp án. Phần Nói do em tự đánh giá hoặc cô giáo chấm.'),
      h('div',{class:'bar',style:'margin:8px 0 0'},h('button',{class:'btn',type:'button',onclick:()=>runTest(mk(def))},'Làm đề mới'),h('button',{class:'btn alt',type:'button',onclick:go},'Về danh sách'))));
    window.scrollTo({top:0,behavior:'smooth'})});
  window.scrollTo(0,0);
  function go(){clearInterval(timerH);show(def.back||'test')}
  function mk(d){return d}
}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const $main=()=>document.getElementById('main');

/* ---------- views ---------- */
let tab=store.get('e4tab','vocab'),unit=store.get('e4unit',1);
function show(t){tab=t;store.set('e4tab',t);clearInterval(timerH);document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===t)));({vocab:vVocab,pat:vPat,test:vTest})[t]();window.scrollTo(0,0)}
function unitPicker(onPick){const box=h('div');UNITS.reduce((acc,u)=>{(acc[u.th]=acc[u.th]||[]).push(u);return acc},[]).forEach((us,i)=>{box.append(h('div',{class:'theme','data-th':i},'Chủ đề '+(i+1)+' · '+THEMES[i]));box.append(h('div',{class:'chips'},us.map(u=>h('button',{class:'chip','data-th':u.th,type:'button','aria-pressed':String(u.id===unit),title:u.t,onclick:()=>{unit=u.id;store.set('e4unit',unit);onPick()}},'Unit '+u.id))))});return box}
function bookPages(u){const names=['Bài 1 · trang 1','Bài 1 · trang 2','Bài 2 · trang 1','Bài 2 · trang 2','Bài 3 · trang 1','Bài 3 · trang 2'];
 return h('div',{style:'margin-top:22px'},h('h3',null,'Tranh trong sách Unit '+u.id),h('p',{class:'sub'},'Trang sách Global Success. Chạm vào trang để phóng to.'),
  h('div',{class:'book'},names.map((n,i)=>h('figure',{class:'pg',onclick:e=>e.currentTarget.classList.toggle('big')},h('img',{src:'pages/u'+u.id+'-'+(i+1)+'.jpg',alt:'Sách Tiếng Anh 4, Unit '+u.id+', '+n,loading:'lazy'}),h('figcaption',null,n)))))}
function unitHead(u,extra){return h('div',{class:'bar'},h('div',{class:'uhead'},h('span',{class:'ubadge','data-th':u.th},u.id),h('div',{style:'min-width:0'},h('h2',{style:'margin:0'},u.t),h('p',{class:'sub',style:'margin:0'},'Unit '+u.id+' · '+u.vi))),extra)}
function practice(u,kinds,label){return h('button',{class:'btn sun',type:'button',onclick:()=>runTest({id:'u'+u.id+kinds,t:label+' · Unit '+u.id,d:u.t,u:[u.id],min:15,back:tab,parts:kinds==='v'?[FULL[0],FULL[1],FULL[8],FULL[6]]:[FULL[3],FULL[4],FULL[5],FULL[2],FULL[7]]})},label)}

function vVocab(){const m=$main();const u=UNITS[unit-1];let hideVi=false;
 const g=h('div',{class:'grid'});
 const draw=()=>{g.classList.toggle('hide-vi',hideVi);g.replaceChildren(...u.vocab.map(v=>h('button',{class:'vc','data-th':u.th,type:'button',onclick:()=>say(v.en,.8),'aria-label':v.en+', '+v.vi},pic(v.pic),h('span',{class:'en'},v.en),h('span',{class:'vi'},v.vi))))};
 const tog=h('button',{class:'btn alt',type:'button','aria-pressed':'false',onclick:e=>{hideVi=!hideVi;e.target.textContent=hideVi?'Hiện nghĩa tiếng Việt':'Ẩn nghĩa tiếng Việt';draw()}},'Ẩn nghĩa tiếng Việt');
 m.replaceChildren(h('div',{class:'hero'},h('span',{class:'big'},'🔤'),h('div',null,h('h2',null,'Từ vựng'),h('p',{class:'sub'},'Chạm vào thẻ để nghe phát âm. Ẩn nghĩa để tự kiểm tra.'))),unitPicker(vVocab),
  unitHead(u,h('div',{class:'bar',style:'margin:0'},tog,h('button',{class:'btn alt',type:'button',onclick:()=>say(u.vocab.map(v=>v.en),.8)},'Nghe tất cả'),practice(u,'v','Luyện từ vựng'))),g,bookPages(u));
 draw()}
function vPat(){const m=$main();const u=UNITS[unit-1];
 const card=h('div',{class:'card'},u.pats.map(p=>h('div',{class:'pat'},h('div',null,h('div',{class:'q'},'A: '+p.q),h('div',{class:'a'},'B: '+p.a),h('div',{class:'v'},p.vi)),spkBtn([p.q,p.a],'Nghe hội thoại'))));
 m.replaceChildren(h('div',{class:'hero'},h('span',{class:'big'},'💬'),h('div',null,h('h2',null,'Mẫu câu'),h('p',{class:'sub'},'Nghe hội thoại và đọc theo các câu hỏi, câu trả lời chính trong sách.'))),unitPicker(vPat),unitHead(u,practice(u,'p','Luyện mẫu câu')),card,bookPages(u))}
function vTest(){const m=$main();
 const mkParts=FULL;
 const ICON=['📝','🎯','🧩','🏆','🌟'];const cards=TESTS.map((t,ti)=>h('div',{class:'card tcard','data-th':ti%4},h('div',{class:'big'},ICON[ti]),h('span',{class:'tag'},t.d),h('h3',null,'Đề '+t.t),h('div',{class:'meta'},'35 phút · 10 điểm · Nghe, Đọc, Viết, Nói'),bestScores[t.id]!=null?h('div',{class:'best'},'Điểm cao nhất: '+String(bestScores[t.id]).replace('.',',')):null,h('button',{class:'btn',type:'button',onclick:()=>runTest({...t,back:'test',parts:mkParts})},'Làm bài')));
 const sel=h('select',{id:'usel','aria-label':'Chọn Unit'},UNITS.map(u=>h('option',{value:u.id},'Unit '+u.id+' · '+u.t)));sel.value=String(unit);
 m.replaceChildren(h('div',{class:'hero'},h('span',{class:'big'},'✏️'),h('div',null,h('h2',null,'Kiểm tra'),h('p',{class:'sub'},'Đề gồm Nghe, Đọc, Viết, Nói như đề mẫu ở lớp. Máy chấm điểm ngay khi bấm “Nộp bài”.'))),h('div',{style:'height:12px'}),
  h('div',{class:'tests'},cards),
  h('div',{class:'card',style:'margin-top:14px'},h('h3',null,'Đề theo từng Unit'),h('p',{class:'sub'},'Chọn một Unit để làm đề ngắn, 15 phút.'),h('div',{class:'bar',style:'margin:0'},sel,h('button',{class:'btn',type:'button',onclick:()=>{const id=+sel.value;unit=id;store.set('e4unit',id);const u=UNITS[id-1];runTest({id:'unit'+id,t:'Đề Unit '+id+' · '+u.t,d:u.vi,u:[id],min:15,back:'test',parts:mkParts})}},'Làm bài'))));}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.t)});
show(tab);
